[project]
name = "eliara-platform"
version = "0.1.0"
description = "Read-only AI business analytics platform over the Eliara analytical database (SAP B1 derived)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "anthropic>=0.40",
    "cachetools>=5.5",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
