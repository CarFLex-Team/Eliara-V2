# Company registry. Loaded by app.company.registry.CompanyRegistry at
# startup (path set by ELIARA_COMPANIES_CONFIG, default "companies.yaml").
#
# Each entry becomes a CompanyConfig. Only company_id, display_name, and
# db_path are required — everything else has a sane default (empty scan
# list, no company-specific prompts/playbooks, shared embedding cache dir,
# status "full").
#
# `status: partial` means the company boots and answers questions normally
# (its database is real and indexed) but is missing curated playbooks,
# scan views, or business glossary data compared to a full company. This
# is visible in GET /api/v1/health/deep as `config_status` — check there,
# not just this file, before assuming a company is at feature parity.
#
# Do not hardcode a company's db path, scan views, or directories anywhere
# else in the codebase — this file is the single source of truth for that.

companies:
  beta:
    display_name: "Beta"
    db_path: data/companies/beta/beta.db
    playbooks_dir: companies/beta/playbooks
    prompts_dir: companies/beta/prompts
    embedding_cache_dir: data/cache/beta
    boundaries_table: fact_ai_sales_net
    boundaries_date_column: posting_date_iso
    scan_views:
      - vw_q012_liquidation_items_highest_capital_locked
      - vw_engine_dead_stock_by_item_group
      - vw_engine_dead_stock_by_warehouse
      - vw_chatbot_slow_moving_items_becoming_dead_stock
      - vw_q018_slow_moving_items_review_priority
      - vw_inventory_action_stockout_replenishment
      - vw_inventory_action_overstock_excess

  tire_guru:
    display_name: "Tire Guru"
    db_path: data/companies/tire_guru/tire_guru.db
    playbooks_dir: companies/tire_guru/playbooks
    prompts_dir: companies/tire_guru/prompts
    embedding_cache_dir: data/cache/tire_guru
    # Tire Guru's registry table has a different name and a different
    # (but compatible, via MetadataLoader's column-adaptation logic)
    # schema than the canonical chatbot_question_view_registry — see
    # issue #28. Confirmed via manual DB inspection: every view_name
    # referenced here resolves to a real view.
    registry_table: chatbot_question_router
    # PARTIAL — see status field below and issue #22. Chat and discovery
    # work normally against the real database (238 objects indexed), but:
    status: partial
    # Curated dead-stock/liquidation/stockout scan views — see issue #6.
    # Confirmed via manual DB inspection (row counts verified live) AND
    # via a synthetic-data test proving the correct value/label columns
    # get auto-detected for each (build_attention_queue picks the FIRST
    # numeric non-hint-excluded column as "value" — raw SELECT * would
    # have silently ranked by on_hand_quantity instead of dead_stock_score/
    # days_since_last_sale, producing a backwards HIGH/LOW ranking; caught
    # before shipping, not after). Each view below explicitly SELECTs a
    # curated, deliberately-ordered column list rather than SELECT * for
    # exactly this reason.
    #   - dead stock: vw_tire_guru_dead_stock_ranked (wraps the pre-built
    #     chatbot_dead_stock_fast table with correct column ordering)
    #   - slow-moving: vw_tire_guru_slow_moving_items (filters
    #     engine_dead_stock_recommendation_v2 WHERE stock_classification
    #     = 'SLOW_MOVING' — 11 rows)
    #   - liquidation/capital-locked: vw_tire_guru_liquidation_candidates
    #     (same source table WHERE stock_classification = 'DEAD_STOCK',
    #     ordered by liquidation_priority_rank — 2 rows)
    #   - stockout/replenishment: vw_tire_guru_critical_stockout (filters
    #     engine_reorder_recommendation_v2 WHERE reorder_urgency =
    #     'CRITICAL_STOCKOUT' — 988 rows)
    # No overstock/excess equivalent exists in this schema at all (no
    # view, no classification value) — Tire Guru's business (tire
    # wholesale) apparently doesn't track that the way Beta does.
    # Confirmed absent, not just unmapped.
    scan_views:
      - vw_tire_guru_dead_stock_ranked
      - vw_tire_guru_slow_moving_items
      - vw_tire_guru_liquidation_candidates
      - vw_tire_guru_critical_stockout
    # boundaries_table/boundaries_date_column intentionally omitted: Tire
    # Guru's fact-table name isn't confirmed yet, so /health/deep will skip
    # the "data through <date>" line for this company rather than assume
    # Beta's table name applies.
    # playbooks_dir/prompts_dir above point at directories that don't exist
    # yet (no Tire Guru-specific playbooks or prompt overrides authored) —
    # this is fine, both fall back to shared/no-op behavior, but it means
    # Tire Guru currently gets zero multi-step business reviews.
