name: supplier_review
title: Supplier review
description: >
  Supplier performance and dependency: spend, delivery reliability, lead
  times and current open exposure.
triggers:
  - supplier review
  - review supplier
  - how is this supplier performing
  - supplier risk
  - trace supplier risk
  - supplier dependency
requires_entity: false
entity_kind: supplier
steps:
  - step: Spend by supplier
    view: vw_chatbot_suppliers_purchase_value_summary
    note: Concentration of spend. A supplier holding a large share is a dependency.
  - step: Overdue purchase order percentage
    view: vw_q088_suppliers_highest_overdue_po_percentage
    note: Reliability as a rate, not a count — fairer to high-volume suppliers.
  - step: Overdue deliveries
    view: vw_q078_overdue_purchase_orders_by_supplier
    note: Which specific deliveries are late right now.
  - step: Lead times
    view: vw_q063_suppliers_longest_shortest_lead_times
    note: Long lead times force larger safety stock and lock up capital.
  - step: Open purchase order exposure
    view: vw_procurement_open_po_monitoring_queue
    note: Committed spend not yet received.
  - step: Suppliers with no purchases this year
    view: vw_chatbot_suppliers_no_purchases_this_year
    note: Dormant relationships — possible lost alternatives if a main supplier fails.
synthesis: |
  Lead with the dependency picture: how concentrated is spend, and on whom.
  Then flag suppliers that are BOTH high-spend and unreliable — that
  combination is the actual risk, not either alone. Note any long lead times
  that justify holding more stock.
  Close with one concrete action: renegotiate, dual-source, or escalate.
