name: business_review
title: Business review
description: >
  Executive overview: headline KPIs, revenue trend, margin, customer
  portfolio and inventory position.
triggers:
  - business review
  - how is the business doing
  - overall performance
  - executive summary
  - summarize the business
  - how are we doing
requires_entity: false
steps:
  - step: Executive KPI snapshot
    view: vw_chatbot_kpis_executive_business_snapshot
    note: Headline numbers.
  - step: Revenue by month, last 12 months
    view: vw_q072_revenue_by_month_last_12_months
    note: Direction of travel — the trend matters more than the level.
  - step: Portfolio margin summary
    view: vw_q051_current_portfolio_margin_summary
    note: Whether revenue growth is converting to profit.
  - step: Year over year revenue and margin
    view: vw_q057_yearly_revenue_cost_profit_margin_trend
    note: Longer baseline, removes seasonal noise.
  - step: Customer portfolio summary
    view: vw_q001_overall_customer_portfolio_summary
    note: Health of the customer base underneath the revenue line.
  - step: Warehouse KPI summary
    view: vw_chatbot_kpis_warehouse_summary_v5
    note: Inventory position — capital tied up against sales.
synthesis: |
  One opening sentence on revenue and its direction. Then at most four
  bullets covering margin, customers, inventory, and the single biggest
  change. Name what moved and by how much.
  Do not produce a dashboard in prose — pick what a managing director would
  act on this week and leave the rest.
