name: procurement_plan
title: Procurement plan
description: >
  What needs buying, what is already committed, and what is late.
triggers:
  - procurement plan
  - what should we buy
  - purchasing plan
  - what needs ordering
  - emergency procurement
requires_entity: false
steps:
  - step: Emergency procurement risk
    view: vw_q065_items_emergency_procurement_risk
    note: Items at risk of stocking out imminently. Highest urgency.
  - step: Below minimum stock
    view: vw_inventory_action_stockout_replenishment
    note: The standard replenishment list.
  - step: Open purchase orders
    view: vw_procurement_open_po_monitoring_queue
    note: Already committed — do not double-order these.
  - step: Overdue purchase orders
    view: vw_chatbot_purchasing_overdue_purchase_orders
    note: Ordered but late. Chase before reordering elsewhere.
  - step: Monthly procurement trend
    view: vw_chatbot_purchasing_monthly_procurement_trend
    note: Whether spend is rising faster than sales.
synthesis: |
  Lead with what is urgent — items about to stock out that are NOT already on
  an open order. That distinction is the whole value of this review.
  Then late deliveries worth chasing. At most three named examples each.
  Close with one line on whether procurement spend is tracking sales.
