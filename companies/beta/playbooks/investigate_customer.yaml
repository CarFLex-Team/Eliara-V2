name: investigate_customer
title: Customer investigation
description: >
  Full picture of one customer: value, profitability, payment behaviour,
  order rhythm and churn risk, read together.
triggers:
  - investigate customer
  - tell me about customer
  - customer profile
  - expand on customer
  - full picture of
  - how is this customer doing
requires_entity: true
entity_kind: customer
steps:
  - step: Lifetime value and rank
    view: vw_q002_top_10_customers_by_lifetime_revenue
    note: Portfolio context — where this account sits against the top accounts.
  - step: Profitability
    view: vw_margin_customer_profitability
    filter_by: customer_name
    note: Revenue is not profit. Check margin before recommending any action.
  - step: Outstanding balances and aging
    view: vw_q076_customers_outstanding_balances_aging_buckets
    filter_by: customer_name
    note: Overdue exposure. A high-revenue account that does not pay is a risk.
  - step: Order frequency
    view: vw_q009_customers_highest_invoice_frequency
    filter_by: customer_name
    note: Rhythm of ordering — many small orders behaves differently to few large ones.
  - step: Recency since last order
    view: vw_q007_customers_longest_since_last_order
    filter_by: customer_name
    note: Days since last purchase. The leading indicator of churn.
  - step: Risk and inactivity flags
    view: vw_q003_customers_at_risk_or_inactive
    filter_by: customer_name
    note: Whether the account is already flagged at risk or inactive.
synthesis: |
  Open with what this customer is worth and whether that is trending up or
  down. Then, in at most four bullets: profitability, payment behaviour,
  order rhythm, and risk. Close with ONE recommended action naming who should
  do it.
  If revenue is high but margin is thin, or the account pays late, say so
  plainly — that is the point of reading these together.
