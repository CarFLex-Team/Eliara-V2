name: stock_action_plan
title: Stock action plan
description: >
  What to do about inventory right now: liquidate, watch, or buy — with the
  capital at stake in each.
triggers:
  - stock action plan
  - what should i do about stock
  - inventory action plan
  - what should we be buying
  - top inventory risks
  - inventory risks right now
requires_entity: false
steps:
  - step: Liquidate — highest capital locked
    view: vw_q012_liquidation_items_highest_capital_locked
    note: Dead stock ranked by money tied up. The liquidation shortlist.
  - step: Dead stock concentration by category
    view: vw_engine_dead_stock_by_item_group
    note: Where the problem clusters — points at the purchasing decision behind it.
  - step: Dead stock by warehouse
    view: vw_engine_dead_stock_by_warehouse
    note: Which site holds it, and therefore who acts.
  - step: Becoming dead stock
    view: vw_chatbot_slow_moving_items_becoming_dead_stock
    note: Early warning. Cheaper to discount now than to write off later.
  - step: Slow moving review priority
    view: vw_q018_slow_moving_items_review_priority
    note: Ranked watch list.
  - step: Replenish — below minimum
    view: vw_inventory_action_stockout_replenishment
    note: The buy side. Stockouts cost sales while dead stock costs capital.
  - step: Excess inventory
    view: vw_inventory_action_overstock_excess
    note: Over-ordered lines — stop reordering before they become dead stock.
synthesis: |
  Structure as three short groups: LIQUIDATE, WATCH, BUY. Give the total
  capital locked first, then no more than three named examples per group.
  Do not list every item — the table alongside shows those.
  Close with the single highest-value action this week.
